# Decap CMS (Netlify CMS) configuration for SHIELDTECH
# This powers the real admin at /admin  (after setting up Netlify Identity).
#
# Every product lives in the single file content/shop.json so the static
# site can fetch it with NO build step. The CMS edits that one file.

backend:
  name: git-gateway
  branch: main          # change to 'master' if your repo's default branch is master
  commit_messages:
    create: 'CMS: create {{collection}} "{{slug}}"'
    update: 'CMS: update {{collection}} "{{slug}}"'
    delete: 'CMS: delete {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: upload "{{path}}"'
    deleteMedia: 'CMS: delete "{{path}}"'

# Uncomment the two lines below to test WITHOUT a host, using:  npx decap-server
# local_backend: true
# local_backend_url: http://localhost:8081/api/v1

media_folder: "img/products"
public_folder: "/img/products"

site_url: "https://shieldtechweb.netlify.app"
display_url: "https://shieldtechweb.netlify.app"
logo_url: "/img/logo/logo.png"

collections:
  - name: "shop"
    label: "Shop & Inventory"
    label_singular: "Product"
    files:
      - name: "products"
        label: "Products"
        file: "content/shop.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            allow_add: true
            collapsed: true
            summary: "{{fields.name}} — {{fields.price}} ({{fields.category}})"
            fields:
              - { label: "Product Name", name: "name", widget: "string", required: true }
              - { label: "Slug (URL name, no spaces)", name: "slug", widget: "string", required: true, hint: "e.g. wireless-mouse" }
              - { label: "Category", name: "category", widget: "select", options: ["keyboards", "storage", "power", "audio"], required: true }
              - { label: "Price (KES)", name: "price", widget: "string", required: true, hint: "e.g. KES 800" }
              - { label: "Stock Status", name: "stock", widget: "select", options: ["in-stock", "out-of-stock"], default: "in-stock" }
              - { label: "Short Description", name: "description", widget: "text", required: true }
              - { label: "Photo", name: "image", widget: "image", required: false, hint: "Upload a product photo (goes to img/uploads/)" }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Business Info"
        file: "content/settings.json"
        fields:
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "WhatsApp Number", name: "whatsapp", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
